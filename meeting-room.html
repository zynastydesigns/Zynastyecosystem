<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Meeting Assistant (Supabase + Storage + RPC)</title>

  <!-- The import map that used to sit here only existed to support a
       dynamic `import('https://esm.sh/@mui/icons-material...')` for
       icons. That import has been removed (see the ICON LIBRARY
       section in the app script) in favor of self-contained inline
       SVG icons, so the import map - and the ES module bridge script
       that used it - are no longer needed at all. -->

  <!-- ============================================================
       STARTUP DIAGNOSTICS BOOTSTRAP
       Loaded first, before any dependency, using plain JS (no Babel,
       no React) so it can run and report even if everything else
       downstream fails to parse or load.
  ============================================================ -->
  <script>
    (function () {
      window.__startup = {
        steps: [],
        rendered: false,
        watchdogFired: false,
      };

      function markStep(step, ok, detail) {
        window.__startup.steps.push({
          step: step,
          ok: !!ok,
          detail: detail || '',
          time: new Date().toISOString(),
        });
        var tag = ok ? '\u2713' : '\u2717';
        if (ok) {
          console.log('[Startup] ' + tag + ' ' + step + (detail ? ' - ' + detail : ''));
        } else {
          console.error('[Startup] ' + tag + ' ' + step + (detail ? ' - ' + detail : ''));
        }
      }
      window.__markStep = markStep;

      markStep('HTML Loaded', true);

      function escapeHtml(str) {
        return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function suggestFix(message, filename) {
        var m = (message || '').toLowerCase();
        if (m.indexOf('unexpected identifier') !== -1 || m.indexOf('unexpected token') !== -1) {
          return 'There is a JavaScript syntax error in the inline app script. Check the file/line indicated below for a typo, mismatched bracket, or invalid syntax construct (e.g. using import-style "X as Y" inside a plain object literal instead of "X: Y").';
        }
        if (m.indexOf('is not defined') !== -1) {
          return 'A variable or library global is being referenced before it was loaded or defined. Check that the corresponding <script> tag (React, MUI, Emotion, Supabase, Babel) loaded successfully and appears before the app script, and that CDN network access is not blocked.';
        }
        if (m.indexOf('failed to fetch') !== -1 || m.indexOf('networkerror') !== -1 || m.indexOf('load') !== -1) {
          return 'A network request or external script failed to load. Check the Network tab for failed requests (CDN scripts, fonts, Supabase, Gemini) and verify CORS/MIME type/HTTP status.';
        }
        if (m.indexOf('cannot read propert') !== -1 || m.indexOf('cannot read of undefined') !== -1 || m.indexOf('undefined is not an object') !== -1) {
          return 'Code is trying to access a property on something that is undefined/null — often caused by a library (MUI/Emotion/Supabase) not finishing initialization before the app code runs, or a missing config value.';
        }
        return 'Check the stack trace and file/line below, open browser DevTools Console + Network tabs, and verify every startup step above shows a checkmark.';
      }

      window.__showDiagnostic = function (info) {
        info = info || {};
        try {
          var root = document.getElementById('root');
          if (!root) return;
          var stepsHtml = window.__startup.steps.map(function (s) {
            return '<div style="display:flex;gap:8px;padding:4px 0;font-family:monospace;font-size:13px;">' +
              '<span style="color:' + (s.ok ? '#00b894' : '#e17055') + ';font-weight:700;">' + (s.ok ? '\u2713' : '\u2717') + '</span>' +
              '<span>' + escapeHtml(s.step) + (s.detail ? ' <span style="color:#8b92a5;">(' + escapeHtml(s.detail) + ')</span>' : '') + '</span>' +
              '</div>';
          }).join('');

          var message = escapeHtml(info.message || 'Unknown startup error');
          var filename = escapeHtml(info.filename || 'unknown');
          var lineno = info.lineno != null ? info.lineno : '?';
          var colno = info.colno != null ? info.colno : '?';
          var stack = escapeHtml(info.stack || '(no stack trace available)');
          var failedStep = escapeHtml(info.failedStep || 'Unknown step');
          var fix = escapeHtml(suggestFix(info.message, info.filename));

          root.innerHTML =
            '<div style="max-width:760px;width:92vw;margin:32px auto;text-align:left;background:#fff;border:1px solid #f0d0d0;border-radius:16px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.08);font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#1a1a2e;max-height:90vh;overflow:auto;">' +
              '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">' +
                '<div style="width:36px;height:36px;border-radius:50%;background:#fdecea;color:#e17055;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;">!</div>' +
                '<div style="font-size:18px;font-weight:700;">AI Meeting Assistant failed to start</div>' +
              '</div>' +
              '<div style="font-size:13px;color:#5a5a7a;margin-bottom:16px;">The app never finished loading. Details below should point to the exact cause.</div>' +

              '<div style="margin-bottom:16px;">' +
                '<div style="font-weight:600;font-size:13px;margin-bottom:6px;">Startup steps</div>' +
                '<div style="background:#f5f7fb;border-radius:10px;padding:10px 14px;">' + (stepsHtml || '<span style="color:#8b92a5;">No steps recorded before failure.</span>') + '</div>' +
              '</div>' +

              '<div style="margin-bottom:12px;">' +
                '<div style="font-weight:600;font-size:13px;margin-bottom:4px;">Failed step</div>' +
                '<div style="font-family:monospace;font-size:13px;color:#e17055;">' + failedStep + '</div>' +
              '</div>' +
              '<div style="margin-bottom:12px;">' +
                '<div style="font-weight:600;font-size:13px;margin-bottom:4px;">Error message</div>' +
                '<div style="font-family:monospace;font-size:13px;background:#fdecea;padding:8px 10px;border-radius:8px;white-space:pre-wrap;">' + message + '</div>' +
              '</div>' +
              '<div style="margin-bottom:12px;">' +
                '<div style="font-weight:600;font-size:13px;margin-bottom:4px;">File / Line / Column</div>' +
                '<div style="font-family:monospace;font-size:13px;">' + filename + ' : ' + lineno + ' : ' + colno + '</div>' +
              '</div>' +
              '<div style="margin-bottom:12px;">' +
                '<div style="font-weight:600;font-size:13px;margin-bottom:4px;">Stack trace</div>' +
                '<pre style="font-family:monospace;font-size:11px;background:#f5f7fb;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:220px;overflow:auto;">' + stack + '</pre>' +
              '</div>' +
              '<div style="margin-bottom:4px;">' +
                '<div style="font-weight:600;font-size:13px;margin-bottom:4px;">Suggested fix</div>' +
                '<div style="font-size:13px;color:#1a1a2e;background:#eafaf1;padding:8px 10px;border-radius:8px;">' + fix + '</div>' +
              '</div>' +
              '<div style="margin-top:16px;display:flex;gap:8px;">' +
                '<button onclick="location.reload()" style="cursor:pointer;border:none;border-radius:10px;padding:8px 16px;background:#5B5FEF;color:#fff;font-weight:600;font-size:13px;">Reload</button>' +
              '</div>' +
            '</div>';
        } catch (renderErr) {
          console.error('Failed to render diagnostic screen', renderErr);
        }
      };

      window.onerror = function (message, filename, lineno, colno, error) {
        markStep('Uncaught error', false, message);
        window.__showDiagnostic({
          message: message,
          filename: filename,
          lineno: lineno,
          colno: colno,
          stack: error && error.stack ? error.stack : null,
          failedStep: window.__startup.steps.length ? window.__startup.steps[window.__startup.steps.length - 1].step : 'Script execution',
        });
        return false; // still let it log to console
      };

      window.onunhandledrejection = function (event) {
        var reason = event.reason;
        var message = reason && reason.message ? reason.message : String(reason);
        markStep('Unhandled promise rejection', false, message);
        window.__showDiagnostic({
          message: message,
          filename: '(async / promise)',
          lineno: null,
          colno: null,
          stack: reason && reason.stack ? reason.stack : null,
          failedStep: 'Unhandled promise rejection',
        });
      };

      // Watchdog: if the real app hasn't signaled a successful render
      // within 12s of HTML load, something is stuck (e.g. a CDN script
      // silently failed to load, or an init awaited forever). Show a
      // diagnostic instead of leaving the spinner forever.
      window.setTimeout(function () {
        if (!window.__startup.rendered) {
          window.__startup.watchdogFired = true;
          markStep('Watchdog timeout (12s)', false, 'App did not signal a successful render in time');
          window.__showDiagnostic({
            message: 'Startup watchdog timed out after 12 seconds. The app never reported a successful render.',
            filename: 'Meeting_summary_app.html',
            lineno: null,
            colno: null,
            stack: null,
            failedStep: window.__startup.steps.length ? window.__startup.steps[window.__startup.steps.length - 1].step : 'Initial load',
          });
        }
      }, 12000);
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React & ReactDOM -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"
    onload="window.__markStep('React Loaded', true)"
    onerror="window.__markStep('React Loaded', false, 'CDN script failed to load'); window.__showDiagnostic({message:'Failed to load React from CDN', filename:'react.production.min.js', failedStep:'React Loaded'});"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"
    onload="window.__markStep('ReactDOM Loaded', true)"
    onerror="window.__markStep('ReactDOM Loaded', false, 'CDN script failed to load'); window.__showDiagnostic({message:'Failed to load ReactDOM from CDN', filename:'react-dom.production.min.js', failedStep:'ReactDOM Loaded'});"></script>

  <!-- Babel Standalone -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"
    onload="window.__markStep('Babel Loaded', true)"
    onerror="window.__markStep('Babel Loaded', false, 'CDN script failed to load'); window.__showDiagnostic({message:'Failed to load Babel Standalone from CDN', filename:'babel.min.js', failedStep:'Babel Loaded'});"></script>

  <!-- Emotion & MUI -->
  <script src="https://cdn.jsdelivr.net/npm/@emotion/react@11.11.1/dist/emotion-react.umd.min.js"
    onload="window.__markStep('Emotion (react) Loaded', true)"
    onerror="window.__markStep('Emotion (react) Loaded', false, 'CDN script failed to load'); window.__showDiagnostic({message:'Failed to load @emotion/react from CDN', filename:'emotion-react.umd.min.js', failedStep:'Emotion Loaded'});"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emotion/styled@11.11.0/dist/emotion-styled.umd.min.js"
    onload="window.__markStep('Emotion (styled) Loaded', true)"
    onerror="window.__markStep('Emotion (styled) Loaded', false, 'CDN script failed to load'); window.__showDiagnostic({message:'Failed to load @emotion/styled from CDN', filename:'emotion-styled.umd.min.js', failedStep:'Emotion Loaded'});"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mui/material@5.14.20/umd/material-ui.production.min.js"
    onload="window.__markStep('Material UI Loaded', true)"
    onerror="window.__markStep('Material UI Loaded', false, 'CDN script failed to load'); window.__showDiagnostic({message:'Failed to load @mui/material from CDN', filename:'material-ui.production.min.js', failedStep:'Material UI Loaded'});"></script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    onload="window.__markStep('Supabase JS Loaded', true)"
    onerror="window.__markStep('Supabase JS Loaded', false, 'CDN script failed to load'); window.__showDiagnostic({message:'Failed to load @supabase/supabase-js from CDN', filename:'supabase.min.js', failedStep:'Supabase JS Loaded'});"></script>

  <!-- ============================================================
       BRIDGE SCRIPT
       The app code expects window['@mui/material'] and
       window['@mui/material/styles'] to exist. The MUI UMD CDN build
       actually exposes a single global named `MaterialUI` (not those
       bracket keys), so this just aliases it. This used to also have
       to asynchronously load @mui/icons-material via a dynamic
       import() from esm.sh (no UMD build of that package has ever
       existed) - that import was unreliable over flaky/blocked
       networks and silently fell back to blank placeholder icons.
       It has been removed entirely: every icon the app uses is now a
       small inline SVG defined directly in the app script (see the
       ICON LIBRARY section), built on top of @mui/material's own
       <SvgIcon>, so there is nothing left to fetch or wait for here.
       This is a plain synchronous classic script, so it always runs
       before the Babel-processed app script below it.
  ============================================================ -->
  <script>
    if (window.MaterialUI) {
      window['@mui/material'] = window.MaterialUI;
      window['@mui/material/styles'] = window.MaterialUI;
      window.__markStep && window.__markStep('Material UI global bridged', true);
    } else {
      window.__markStep && window.__markStep('Material UI global bridged', false, 'window.MaterialUI was not set - check CDN load above');
    }
  </script>

  <style>

  <script>window.__markStep && window.__markStep('CSS Loaded', true);</script>

<body>
  <div id="root">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div>Loading AI Meeting Assistant...</div>
    </div>
  </div>

  <script type="text/babel">
    window.__markStep && window.__markStep('JavaScript Loaded', true, 'App script began executing (Babel parse succeeded)');

    // ============================================================
    //  IMPORTS
    // ============================================================
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext, useReducer } = React;
    const { createRoot } = ReactDOM;

    const {
      ThemeProvider,
      createTheme,
      CssBaseline,
      Box,
      AppBar,
      Toolbar,
      Typography,
      IconButton,
      Drawer,
      List,
      ListItem,
      ListItemButton,
      ListItemIcon,
      ListItemText,
      Card,
      CardContent,
      Button,
      Fab,
      Chip,
      TextField,
      InputAdornment,
      Avatar,
      Divider,
      Paper,
      Grid,
      Stack,
      CircularProgress,
      LinearProgress,
      Tabs,
      Tab,
      MenuItem,
      Menu,
      Dialog,
      DialogTitle,
      DialogContent,
      DialogActions,
      Snackbar,
      Alert,
      Switch,
      FormControlLabel,
      Select,
      FormControl,
      InputLabel,
      useTheme,
      alpha,
      Checkbox,
      Tooltip,
      Fade,
      Zoom,
      Badge,
      IconButton: MuiIconButton,
      Input,
      OutlinedInput,
      FormHelperText,
      SvgIcon,
    } = window['@mui/material'];

    const { responsiveFontSizes } = window['@mui/material/styles'];

    // ============================================================
    //  ICON LIBRARY (self-contained, zero network dependency)
    // ------------------------------------------------------------
    //  @mui/icons-material has never shipped a UMD/CDN build, so it
    //  previously had to be pulled in at runtime via a dynamic
    //  `import('https://esm.sh/@mui/icons-material...')` inside a
    //  <script type="module"> in <head>. That import is exactly the
    //  kind of unreliable dependency that breaks in the wild: slow
    //  networks, blocked/throttled esm.sh requests, or an 8s timeout
    //  all silently fell back to a Proxy of empty circular
    //  placeholder icons (see the removed fallback in <head>) - which
    //  is why every icon in the app could render as a blank circle.
    //
    //  Fix: every icon below is a small inline SVG, in the Lucide
    //  icon style (24x24, stroke-based, rounded caps/joins), wrapped
    //  in MUI's <SvgIcon>. SvgIcon ships inside @mui/material itself
    //  (already loaded reliably via the classic UMD <script> tag and
    //  bridged to window['@mui/material'] above) - so there is no
    //  second library, no dynamic import, and no network dependency
    //  at all for icons. Every icon still supports the same props
    //  the rest of the app already uses (sx, fontSize, style, color),
    //  because SvgIcon is the exact same base class MUI's own
    //  generated icon components use internally.
    // ============================================================
    const LucideIcon = ({ children, ...props }) => React.createElement(
      SvgIcon,
      Object.assign({
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: 'currentColor',
        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
      }, props),
      children
    );

    const DashboardIcon = (props) => React.createElement(LucideIcon, props,
      React.createElement('rect', { x: 3, y: 3, width: 7, height: 9, rx: 1.5 }),
      React.createElement('rect', { x: 14, y: 3, width: 7, height: 5, rx: 1.5 }),
      React.createElement('rect', { x: 14, y: 12, width: 7, height: 9, rx: 1.5 }),
      React.createElement('rect', { x: 3, y: 16, width: 7, height: 5, rx: 1.5 })
    );

    const MicIcon = (props) => React.createElement(LucideIcon, props,
      React.createElement('rect', { x: 9, y: 2, width: 6, height: 12, rx: 3 }),
      React.createElement('path', { d: 'M19 10v1a7 7 0 0 1-14 0v-1' }),
      React.createElement('line', { x1: 12, y1: 18, x2: 12, y2: 22 }),
      React.createElement('line', { x1: 8, y1: 22, x2: 16, y2: 22 })
    );

    const HistoryIcon = (props) => React.createElement(LucideIcon, props,
      React.createElement('path', { d: 'M3 12a9 9 0 1 0 3-6.7' }),
      React.createElement('polyline', { points: '3 4 3 9 8 9' }),
      React.createElement('polyline', { points: '12 7 12 12 16 14' })
    );

    const SettingsIcon = (props) => React.createElement(LucideIcon, props,
      React.createElement('circle', { cx: 12, cy: 12, r: 3 }),
      React.createElement('path', { d: 'M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z' })
    );

    const DescriptionIcon = (props) => React.createElement(LucideIcon, props,

        this.isRecording = false;
        this.isPaused = false;
        this.startTime = null;
        this.pausedTime = 0;
        this.timerInterval = null;
        this.onDataAvailable = null;
        this.onStop = null;
        this.onTimerUpdate = null;
        this.audioContext = null;
        this.analyser = null;
        this.volumeInterval = null;
      }

      async start() {
        try {
          this.stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            }
          });
          this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
          this.analyser = this.audioContext.createAnalyser();
          this.analyser.fftSize = 256;
          const source = this.audioContext.createMediaStreamSource(this.stream);
          source.connect(this.analyser);

          this.mediaRecorder = new MediaRecorder(this.stream);
          this.audioChunks = [];
          this.mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
              this.audioChunks.push(e.data);
              if (this.onDataAvailable) this.onDataAvailable(e.data);
            }
          };
          this.mediaRecorder.onstop = () => {
            const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
            if (this.onStop) this.onStop(blob);
            this.isRecording = false;
            this.isPaused = false;
            if (this.timerInterval) clearInterval(this.timerInterval);
            if (this.volumeInterval) clearInterval(this.volumeInterval);
          };
          this.mediaRecorder.start(1000);
          this.isRecording = true;
          this.isPaused = false;
          this.startTime = Date.now();
          this.pausedTime = 0;

          this.timerInterval = setInterval(() => {
            if (this.onTimerUpdate && !this.isPaused) {
              const elapsed = (Date.now() - this.startTime - this.pausedTime) / 1000;
              this.onTimerUpdate(elapsed);
            }
          }, 100);
          this.volumeInterval = setInterval(() => {
            if (this.analyser && this.onTimerUpdate) {
              const data = new Uint8Array(this.analyser.frequencyBinCount);
              this.analyser.getByteFrequencyData(data);
              const avg = data.reduce((a, b) => a + b, 0) / data.length;
              const vol = Math.min(1, avg / 128);
              this.onTimerUpdate(null, vol);
            }
          }, 100);
          return true;
        } catch (err) {
          throw err;
        }
      }

      pause() {
        if (this.isRecording && !this.isPaused && this.mediaRecorder) {
          this.mediaRecorder.pause();
          this.isPaused = true;
          this.pausedTime += Date.now() - this.startTime - this.pausedTime;
          return true;
        }
        return false;
      }

      resume() {
        if (this.isRecording && this.isPaused && this.mediaRecorder) {
          this.mediaRecorder.resume();
          this.isPaused = false;
          this.startTime = Date.now();
          return true;
        }
        return false;
      }

      stop() {
        if (this.mediaRecorder && this.isRecording) {
          this.mediaRecorder.stop();
          this.isRecording = false;
          if (this.timerInterval) clearInterval(this.timerInterval);
          if (this.volumeInterval) clearInterval(this.volumeInterval);
          if (this.stream) {
            this.stream.getTracks().forEach(track => track.stop());
            this.stream = null;
          }
          if (this.audioContext) {
            this.audioContext.close();
            this.audioContext = null;
          }
          return true;
        }
        return false;
      }

      getDuration() {
        if (!this.startTime) return 0;
        const elapsed = (Date.now() - this.startTime - this.pausedTime) / 1000;
        return Math.max(0, elapsed);
      }

      getStatus() {
        if (this.isRecording && this.isPaused) return 'paused';
        if (this.isRecording) return 'recording';
        return 'idle';
      }

      getAudioBlob() {
        if (this.audioChunks.length === 0) return null;
        return new Blob(this.audioChunks, { type: 'audio/webm' });
      }
    }

    //  TRANSCRIPTION SERVICE
    // ============================================================
    class TranscriptionService {
      constructor() {
        this.recognition = null;
        this.isListening = false;
        this.finalTranscript = '';
        this.interimTranscript = '';
        this.onResult = null;
        this.onEnd = null;
        this.segments = [];
        this.speakerCount = 0;
        this.segmentStartTime = 0;
        this.lastFinalText = '';
      }

      start() {
        return new Promise((resolve, reject) => {
          try {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
              reject(new Error('Speech recognition not supported'));
              return;
            }
            this.recognition = new SpeechRecognition();
            this.recognition.continuous = true;
            this.recognition.interimResults = true;
            this.recognition.lang = 'en-US';
            this.recognition.maxAlternatives = 1;

            this.finalTranscript = '';
            this.interimTranscript = '';
            this.segments = [];
            this.speakerCount = 0;
            this.segmentStartTime = 0;
            this.lastFinalText = '';

            this.recognition.onresult = (e) => {
              let interim = '';
              let final = '';
              for (let i = e.resultIndex; i < e.results.length; i++) {
                const result = e.results[i];
                const transcript = result[0].transcript;
                if (result.isFinal) {
                  final += transcript + ' ';
                  if (this.segmentStartTime === 0) this.segmentStartTime = Date.now();
                  const words = transcript.split(/\s+/);
                  if (words.length > 2 && transcript.trim().length > 3) {
                    const speakerId = (this.speakerCount % 2) + 1;
                    this.speakerCount++;
                    this.segments.push({
                      speaker: `Speaker ${speakerId}`,
                      text: transcript.trim(),
                      timestamp: (Date.now() - this.segmentStartTime) / 1000,
                    });
                  }
                  this.lastFinalText = transcript;
                } else {
                  interim += transcript;
                }
              }
              this.finalTranscript += final;
              this.interimTranscript = interim;
              if (this.onResult) {
                this.onResult({
                  final: this.finalTranscript,
                  interim: this.interimTranscript,
                  segments: this.segments,
                });
              }
            };

            this.recognition.onerror = (e) => {
              console.warn('Speech recognition error:', e.error);
              if (e.error === 'not-allowed') reject(new Error('Microphone permission denied'));
              if (this.onEnd) {
                this.onEnd({ final: this.finalTranscript, segments: this.segments });
              }
            };

            this.recognition.onend = () => {
              this.isListening = false;
              if (this.onEnd) {
                this.onEnd({ final: this.finalTranscript, segments: this.segments });
              }
            };

            this.recognition.start();
            this.isListening = true;
            this.segmentStartTime = Date.now();
            resolve();
          } catch (err) {
            reject(err);
          }
        });
      }

      stop() {
        if (this.recognition && this.isListening) {
          this.recognition.stop();
          this.isListening = false;
          return { final: this.finalTranscript, segments: this.segments };
        }
        return { final: this.finalTranscript || 'No speech detected.', segments: this.segments };
      }

      isSupported() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      }
    }

    class GeminiService {
      constructor(apiKey) {
        this.apiKey = apiKey;
        this.baseUrl = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';
      }

      async generateSummary(transcript, title) {
        if (!this.apiKey) throw new Error('Gemini API key not set.');
        const prompt = `
          You are an AI meeting assistant. Analyze the following meeting transcript and generate a structured JSON summary with the following fields. Return ONLY valid JSON, no extra text.

          Transcript:
          ${transcript}

          Meeting Title (infer from content): ${title || ''}

          Generate JSON with these fields (use empty arrays or null for missing data):
          {
            "title": "Inferred meeting title",
            "executiveSummary": "Brief executive summary (2-3 sentences)",
            "keyPoints": ["Key point 1", "Key point 2"],
            "decisions": ["Decision 1"],
            "actionItems": [{"description": "Action item", "priority": "High/Medium/Low", "assignee": "Name", "dueDate": "YYYY-MM-DD"}],
            "pendingTasks": [{"description": "Task", "priority": "High/Medium/Low", "assignee": "Name", "dueDate": "YYYY-MM-DD"}],
            "deadlines": ["Deadline 1"],
            "budget": "Budget amount mentioned or null",
            "people": ["Name 1"],
            "companies": ["Company 1"],
            "questions": ["Question 1"],
            "risks": ["Risk 1"],
            "nextSteps": ["Step 1"],
            "followUpAgenda": ["Agenda item 1"],
            "sentiment": "Positive/Neutral/Negative",
            "tags": ["tag1", "tag2"],
            "bulletNotes": ["Bullet note 1"],
            "detailedNotes": "Detailed meeting notes (paragraph)",
            "oneMinuteSummary": "Very brief 1-minute summary",
            "emailSummary": "Email-ready summary (plain text, with subject line)",
            "whatsappSummary": "WhatsApp-ready summary (plain text)",
            "clientSummary": "Client-friendly summary (plain text)",
            "importantMoments": ["Moment 1"]
          }

          Ensure all fields are present. For actionItems and pendingTasks, try to infer assignees and due dates.
          Use null for any field that cannot be determined.
        `;

        const response = await fetch(`${this.baseUrl}?key=${this.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.3, maxOutputTokens: 2048, topK: 1, topP: 1 },
          }),
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(`Gemini API error (${response.status}): ${text}`);
        }
        const data = await response.json();
        const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const jsonMatch = generatedText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('Could not parse JSON from Gemini response');
        const result = JSON.parse(jsonMatch[0]);
        const defaults = {
          title: '',
          executiveSummary: '',
          keyPoints: [],
          decisions: [],
          actionItems: [],
          pendingTasks: [],
          deadlines: [],
          budget: null,
          people: [],
          companies: [],
          questions: [],
          risks: [],
          nextSteps: [],
          followUpAgenda: [],
          sentiment: 'Neutral',
          tags: [],
          bulletNotes: [],
          detailedNotes: '',
          oneMinuteSummary: '',
          emailSummary: '',
          whatsappSummary: '',
          clientSummary: '',
          importantMoments: [],
        };
        const merged = { ...defaults, ...result };
        ['keyPoints', 'decisions', 'actionItems', 'pendingTasks', 'deadlines', 'people', 'companies', 'questions', 'risks', 'nextSteps', 'followUpAgenda', 'tags', 'bulletNotes', 'importantMoments'].forEach(key => {
          if (!Array.isArray(merged[key])) merged[key] = [];
        });
        merged.actionItems = merged.actionItems.map(item => ({ ...item, id: generateId(), completed: false }));
        merged.pendingTasks = merged.pendingTasks.map(item => ({ ...item, id: generateId(), completed: false }));
        return merged;
      }
    }

    // ============================================================
    //  SHARED SUPABASE CLIENT
    //  Only one client instance should exist per URL/key pair - creating
    //  more than one GoTrueClient against the same storage key causes
    //  Supabase to log warnings and can desync auth session state. Both
    //  the StorageAdapter and the auth/login code below share this.
    // ============================================================
    // Dev-mode diagnostic logging. Enabled on localhost/127.0.0.1/file://,
    // or by adding ?debug=1 to the URL (or localStorage.setItem('authDebug','1')).
    // Never logs passwords - only shapes/metadata of requests & responses.
    const __DEV__ = (
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1' ||
      location.protocol === 'file:' ||
      /[?&]debug=1\b/.test(location.search) ||
      (function () { try { return localStorage.getItem('authDebug') === '1'; } catch (e) { return false; } })()
    );
    const authLog = (label, payload) => {
      if (!__DEV__) return;
      try {
        console.log('%c[Auth] ' + label, 'color:#5B5FEF;font-weight:600;', payload !== undefined ? payload : '');
      } catch (e) {}
    };

    // The redirect target Supabase should send users back to after they
    // click a confirmation or password-reset link in their email. This
    // is a static single-page app with no server routes, so it must be
    // the page's own URL - this SAME url must also be added to
    // Authentication -> URL Configuration -> Redirect URLs in the
    // Supabase Dashboard, or Supabase will silently refuse the redirect.
    const getAuthRedirectUrl = () => window.location.origin + window.location.pathname;

    let __cachedSupabaseClient = null;
    let __cachedSupabaseClientKey = null;
    const getSupabaseClient = (url, anonKey) => {
      if (!url || !anonKey) return null;
      const key = url + '|' + anonKey;
      if (__cachedSupabaseClient && __cachedSupabaseClientKey === key) {
        return __cachedSupabaseClient;
      }
      // Explicit auth options matter here:
      // - persistSession + autoRefreshToken: keep the user logged in across
      //   page refreshes and silently refresh the access token.
      // - detectSessionInUrl: required for BOTH the email-confirmation link
      //   and the password-reset link to work. Without this, Supabase puts
      //   the session tokens in the URL hash when the user lands back on
      //   this page and nothing ever reads them - the confirm/reset link
      //   looks "broken" even though the email was delivered correctly.
      // - flowType 'pkce': the modern, more secure confirmation-link flow.
      // - a storageKey scoped to this project's URL: prevents two different
      //   Supabase projects (or two apps on the same origin) from clobbering
      //   each other's session in localStorage.
      __cachedSupabaseClient = window.supabase.createClient(url, anonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: 'pkce',
          storageKey: 'sb-auth-' + btoa(url).replace(/[^a-zA-Z0-9]/g, ''),
        },
      });
      __cachedSupabaseClientKey = key;
      return __cachedSupabaseClient;
    };

    // ============================================================
    //  STORAGE ADAPTER (Supabase + IndexedDB + Storage + RPC)
    // ============================================================
    // NOTE ON STORAGE STRATEGY
    // ------------------------------------------------------------
    // Recordings (audio, transcripts, summaries, action items, and the
    // meeting records themselves) are ALWAYS stored locally on the
    // device, in IndexedDB. They are never uploaded to, or read from,
    // any server - regardless of whether Supabase credentials are
    // configured. Supabase is used ONLY for account login/authentication
    // (see the auth fetch() calls elsewhere in this file). This class
    // used to also branch into a Supabase-backed cloud storage path
    // whenever Supabase credentials were present, which is what caused
    // "Save" and recordings to silently fail to persist (cloud writes
    // failing due to missing tables/policies/bucket). That cloud
    // storage branch has been removed entirely; this adapter is
    // local-storage-only.
    class StorageAdapter {
      constructor() {
        this.useSupabase = false;
        this.dbName = 'AIMeetingAssistant';
        this.version = 2;
        this.db = null;
      }

      async init() {
        return this.initIndexedDB();
      }

      initIndexedDB() {
        return new Promise((resolve, reject) => {
          let settled = false;
          const timeoutId = setTimeout(() => {
            if (settled) return;
            settled = true;
            if (window.__markStep) window.__markStep('IndexedDB Initialized', false, 'Timed out after 5000ms');
            reject(new Error('IndexedDB open timed out after 5000ms'));
          }, 5000);

          const req = indexedDB.open(this.dbName, this.version);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('meetings')) {
              const store = db.createObjectStore('meetings', { keyPath: 'id' });
              store.createIndex('date', 'date');
              store.createIndex('title', 'title');
            }
            if (!db.objectStoreNames.contains('transcripts')) {
              db.createObjectStore('transcripts', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('summaries')) {
              db.createObjectStore('summaries', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('actionItems')) {
              db.createObjectStore('actionItems', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('settings')) {
              db.createObjectStore('settings', { keyPath: 'key' });
            }
          };
          req.onsuccess = (e) => {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            this.db = e.target.result;
            if (window.__markStep) window.__markStep('IndexedDB Initialized', true);
            resolve(true);
          };
          req.onerror = (e) => {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            if (window.__markStep) window.__markStep('IndexedDB Initialized', false, e.target.error && e.target.error.message);
            reject(e.target.error);
          };
        });
      }

      async put(store, data) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).put(data);
          req.onsuccess = () => resolve(data);
          req.onerror = () => reject(req.error);
        });
      }

      async get(store, id) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(store, 'readonly');
          const req = tx.objectStore(store).get(id);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async getAll(store) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(store, 'readonly');
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async delete(store, id) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).delete(id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async deleteAll(store) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).clear();
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async getByIndex(store, index, value) {
        const all = await this.getAll(store);
        return all.filter(item => item[index] === value);
      }

      // Recordings never leave the device: the audio Blob is converted
      // to a data URL and stored directly inside the meeting record in
      // IndexedDB. meetingId is accepted for API-compatibility with the
      // rest of the app but is not otherwise used here.
      async uploadAudio(meetingId, blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      async searchMeetings(query) {
        const all = await this.getAll('meetings');
        const q = query.toLowerCase();
        return all.filter(m =>
          m.title?.toLowerCase().includes(q) ||
          m.transcript?.toLowerCase().includes(q) ||
          (m.tags || []).some(t => t.toLowerCase().includes(q)) ||
          (m.people || []).some(p => p.toLowerCase().includes(q)) ||
          (m.companies || []).some(c => c.toLowerCase().includes(q))
        );
      }
    }

        return raw || 'Something went wrong. Please try again.';

      // --- Load locally-saved settings once, on mount (independent of auth) ---
      useEffect(() => {
        let isMounted = true;
        const saved = localStorage.getItem('aiMeetingSettings');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            // Only apply keys that actually have a non-empty saved value -
            // this prevents a stale/blank save from an earlier session
            // (e.g. before credentials were configured) from wiping out
            // the built-in defaults in initialState.settings above.
            const nonEmpty = {};
            Object.keys(parsed).forEach((key) => {
              if (parsed[key] !== '' && parsed[key] != null) nonEmpty[key] = parsed[key];
            });
            dispatch({ type: 'SET_SETTINGS', payload: nonEmpty });
          } catch (e) {}
        }
        if (isMounted) setSettingsLoaded(true);
        return () => { isMounted = false; };
      }, []);

      // ============================================================
      //  AUTH - ported from the Zynasty CRM portal's authentication
      //  system: plain REST calls to Supabase's GoTrue auth endpoints
      //  (no supabase-js SDK auth calls), an invite-code-gated signup,
      //  a "Remember me" checkbox that decides sessionStorage (tab-
      //  scoped, cleared on browser close) vs localStorage (persists),
      //  and a background token-refresh timer instead of the SDK's
      //  automatic refresh. Password reset is admin-mediated in this
      //  system (no self-service reset email) - see the Login screen's
      //  "Forgot password?" hint.
      //
      //  The `session` object this produces - { access_token,
      //  refresh_token, user: { id, email, ... } } - matches the shape
      //  the rest of the app (StorageAdapter, Layout's avatar, etc.)
      //  already expects from supabase-js, so nothing downstream of
      //  `session` needed to change.
      // ============================================================
      const SESSION_KEY = 'aiMeetingSession';
      // Shared code staff use to self-register. Visible in page source
      // by design - it only screens out random visitors, not a real
      // secret. Can be changed in Settings (Developer Mode).
      const INVITE_CODE = state.settings.inviteCode || 'ZYNASTY2026';

      const sessionStore = () => {
        try { if (localStorage.getItem(SESSION_KEY)) return localStorage; } catch (e) {}
        return sessionStorage;
      };
      const saveSession = (sessionData, remember) => {
        const store = remember ? localStorage : sessionStorage;
        const other = remember ? sessionStorage : localStorage;
        try { other.removeItem(SESSION_KEY); } catch (e) {}
        try { store.setItem(SESSION_KEY, JSON.stringify(sessionData)); } catch (e) { authLog('saveSession failed', e && e.message); }
      };
      const clearStoredSession = () => {
        try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
      };
      const loadStoredSession = () => {
        try {
          const raw = sessionStore().getItem(SESSION_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      };

      const refreshStoredSession = async (current) => {
        if (!current || !current.refresh_token) return null;
        try {
          const res = await fetch(`${state.settings.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {
            method: 'POST',
            headers: { apikey: state.settings.supabaseAnonKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh_token: current.refresh_token }),
          });
          const data = await res.json();
          if (!res.ok || !data.access_token) throw new Error((data && (data.error_description || data.msg)) || 'HTTP ' + res.status);
          const updated = { access_token: data.access_token, refresh_token: data.refresh_token || current.refresh_token, user: data.user || current.user };
          const wasRemembered = (() => { try { return !!localStorage.getItem(SESSION_KEY); } catch (e) { return false; } })();
          saveSession(updated, wasRemembered);
          authLog('token refreshed', { userId: updated.user && updated.user.id });
          return updated;
        } catch (e) {
          authLog('token refresh failed', e && e.message);
          return null;
        }
      };

      const stopTokenRefresh = () => {
        if (tokenRefreshTimerRef.current) { clearInterval(tokenRefreshTimerRef.current); tokenRefreshTimerRef.current = null; }
      };
      const startTokenRefresh = () => {
        stopTokenRefresh();
        tokenRefreshTimerRef.current = setInterval(async () => {
          const stored = loadStoredSession();
          if (!stored) return;
          const refreshed = await refreshStoredSession(stored);
          if (refreshed) setSession(refreshed);
        }, 45 * 60 * 1000);
      };

      // --- Auth bootstrap: load whichever session is in storage on mount ---
      useEffect(() => {
        if (!settingsLoaded) return;
        if (!authRequired) {
          setSession(null);
          setAuthChecked(true);
          return;
        }
        const stored = loadStoredSession();
        authLog('session bootstrap', { hasSession: !!stored });
        setSession(stored);
        setAuthChecked(true);
        if (stored) startTokenRefresh();
        return () => stopTokenRefresh();
      }, [settingsLoaded, authRequired, state.settings.supabaseUrl, state.settings.supabaseAnonKey]);

      const signIn = async (email, password, rememberMe) => {
        if (authInFlightRef.current) return;
        authInFlightRef.current = true;
        setAuthError(null);
        setAuthLoading(true);
        authLog('signIn request', { email });
        try {
          const res = await fetch(`${state.settings.supabaseUrl}/auth/v1/token?grant_type=password`, {
            method: 'POST',
            headers: { apikey: state.settings.supabaseAnonKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          authLog('signIn response', { ok: res.ok, hasToken: !!data.access_token });
          if (!res.ok) throw new Error((data && (data.error_description || data.msg)) || 'Invalid email or password.');
          const newSession = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
          saveSession(newSession, !!rememberMe);
          setSession(newSession);
          startTokenRefresh();
        } catch (e) {
          authLog('signIn error', e && e.message);
          setAuthError(mapAuthError(e));
        } finally {
          setAuthLoading(false);
          authInFlightRef.current = false;
        }
      };

      const signUp = async (email, password, inviteCode, rememberMe) => {
        if (authInFlightRef.current) return;
        authInFlightRef.current = true;
        setAuthError(null);
        if ((inviteCode || '').trim() !== INVITE_CODE) {
          setAuthError('Invalid invite code.');
          authInFlightRef.current = false;
          return;
        }
        setAuthLoading(true);
        authLog('signUp request', { email });
        try {
          const res = await fetch(`${state.settings.supabaseUrl}/auth/v1/signup`, {
            method: 'POST',
            headers: { apikey: state.settings.supabaseAnonKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          authLog('signUp response', { ok: res.ok, hasToken: !!data.access_token });
          if (!res.ok) throw new Error((data && (data.error_description || data.msg)) || 'Could not create account.');
          if (data.access_token) {
            const newSession = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
            saveSession(newSession, !!rememberMe);
            setSession(newSession);
            startTokenRefresh();
          } else {
            setAuthError('__CHECK_EMAIL__');
          }
        } catch (e) {
          setAuthError(mapAuthError(e));
        } finally {
          setAuthLoading(false);
          authInFlightRef.current = false;
        }
      };

      const updatePassword = async (newPassword) => {
        setAuthError(null);
        if (!session || !session.access_token) return;
        setAuthLoading(true);
        authLog('update password request');
        try {
          const res = await fetch(`${state.settings.supabaseUrl}/auth/v1/user`, {
            method: 'PUT',
            headers: { apikey: state.settings.supabaseAnonKey, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: newPassword }),
          });
          const data = await res.json();
          authLog('update password response', { ok: res.ok });
          if (!res.ok) throw new Error((data && (data.error_description || data.msg)) || 'Could not update password.');
          setAuthError('__PASSWORD_UPDATED__');
        } catch (e) {
          setAuthError(mapAuthError(e));
        } finally {
          setAuthLoading(false);
        }
      };

      const signOut = async () => {
        authLog('signOut');
        try {
          if (session && session.access_token) {
            await fetch(`${state.settings.supabaseUrl}/auth/v1/logout`, {
              method: 'POST',
              headers: { apikey: state.settings.supabaseAnonKey, Authorization: 'Bearer ' + session.access_token },
            });
          }
        } catch (e) {
          authLog('signOut request failed (clearing local session anyway)', e && e.message);
        }
        stopTokenRefresh();
        clearStoredSession();
        storageRef.current = null;
        setInitialized(false);
        setSession(null);
        dispatch({ type: 'SET_MEETINGS', payload: [] });
      };

      // --- Data init: waits for settings to load, and (if Supabase is
      //     configured) for auth to resolve - either a signed-in session,
      //     or confirmation that no Supabase project is configured at all. ---
      useEffect(() => {
        if (!settingsLoaded) return;
        if (authRequired && !authChecked) return;
        if (authRequired && !session) {
          // Waiting at the login screen - nothing to load yet, but stop
          // showing the startup spinner so that screen can render.

          return;
        }

        let isMounted = true;
        let timeoutId = null;

        if (window.__markStep) {
          window.__markStep(
            'Authentication Initialized',
            true,
            authRequired
              ? ('Signed in as ' + (session && session.user && session.user.email))
              : 'No Supabase project configured (local/offline app)'
          );
        }

        const init = async () => {
          try {
            let settings = state.settings;

            // Recordings/meetings always live in local IndexedDB on this
            // device - the adapter is constructed once and never
            // reconnected based on Supabase settings (those only affect
            // login, handled separately above).
            const adapter = new StorageAdapter();
            await adapter.init();
            storageRef.current = adapter;

            let meetings = await adapter.getAll('meetings');
            meetings = meetings.sort((a, b) => (b.date || 0) - (a.date || 0));
            if (isMounted) dispatch({ type: 'SET_MEETINGS', payload: meetings });

            const storedSettings = await adapter.get('settings', 'appSettings');
            if (storedSettings && isMounted) {
              const merged = { ...settings, ...storedSettings };
              dispatch({ type: 'SET_SETTINGS', payload: merged });
              localStorage.setItem('aiMeetingSettings', JSON.stringify(merged));
              settings = merged;
            }

            if (settings.geminiApiKey) {
              geminiServiceRef.current = new GeminiService(settings.geminiApiKey);
              if (window.__markStep) window.__markStep('Gemini Initialized', true);
            } else if (window.__markStep) {
              window.__markStep('Gemini Initialized', true, 'No API key configured yet - offline mode');
            }

            if (isMounted) setInitialized(true);
            if (window.__markStep) window.__markStep('AppProvider Initialized', true);
          } catch (err) {
            console.error('Init error:', err);
            if (window.__markStep) window.__markStep('AppProvider Initialized', false, err.message);
            if (isMounted) {
              setInitialized(true);
              dispatch({
                type: 'SET_SNACKBAR',
                payload: { message: 'Storage init error: ' + err.message + ' (continuing in offline mode)', severity: 'error' }
              });
            }
          }
        };

        init();
        timeoutId = setTimeout(() => {
          if (isMounted && !initialized) {
            console.warn('Init timed out, forcing render in offline mode');
            if (window.__markStep) window.__markStep('AppProvider Initialized', false, 'Timed out after 3000ms - forced offline mode');
            setInitialized(true);
          }
        }, 3000);

        return () => {
          isMounted = false;
          if (timeoutId) clearTimeout(timeoutId);
        };
      }, [settingsLoaded, authRequired, authChecked, session]);

      useEffect(() => {
        if (!storageRef.current) return;
        const saveSettings = async () => {
          try {
            await storageRef.current.put('settings', { key: 'appSettings', ...state.settings });
            localStorage.setItem('aiMeetingSettings', JSON.stringify(state.settings));
            if (state.settings.geminiApiKey) {
              geminiServiceRef.current = new GeminiService(state.settings.geminiApiKey);
            } else {
              geminiServiceRef.current = null;
            }
            // Note: the local IndexedDB storage connection never needs to be
            // torn down/rebuilt here - it's independent of Supabase settings,
            // which only affect login (see the auth effects above).
          } catch (e) {
            console.error('Error saving settings:', e);
          }
        };
        saveSettings();
      }, [state.settings]);

      const addMeeting = async (meeting) => {
        const adapter = storageRef.current;
        if (!adapter) throw new Error('Storage not initialized');
        await adapter.put('meetings', meeting);
        dispatch({ type: 'ADD_MEETING', payload: meeting });
        return meeting;
      };

      const updateMeeting = async (meeting) => {
        const adapter = storageRef.current;
        if (!adapter) throw new Error('Storage not initialized');
        await adapter.put('meetings', meeting);
        dispatch({ type: 'UPDATE_MEETING', payload: meeting });
        return meeting;
      };

      const deleteMeeting = async (id) => {
        const adapter = storageRef.current;
        if (!adapter) throw new Error('Storage not initialized');
        await adapter.delete('meetings', id);
        await adapter.deleteAll('transcripts');
        await adapter.deleteAll('summaries');
        await adapter.deleteAll('actionItems');
        dispatch({ type: 'DELETE_MEETING', payload: id });
      };

      const getMeeting = async (id) => {
        const adapter = storageRef.current;
        if (!adapter) return null;
        return await adapter.get('meetings', id);
      };

      const generateSummary = async (transcript, title) => {
        if (!geminiServiceRef.current) {
          throw new Error('Gemini API key not configured. Please add your API key in Settings.');
        }
        return await geminiServiceRef.current.generateSummary(transcript, title);
      };

      const saveTranscript = async (meetingId, transcript) => {
        const adapter = storageRef.current;
        if (!adapter) throw new Error('Storage not initialized');
        const data = { id: generateId(), meetingId, text: transcript, updated: Date.now() };
        await adapter.put('transcripts', data);
        return data;
      };

      const saveSummary = async (meetingId, summary) => {
        const adapter = storageRef.current;
        if (!adapter) throw new Error('Storage not initialized');
        const data = { id: generateId(), meetingId, data: summary, updated: Date.now() };
        await adapter.put('summaries', data);
        return data;
      };

      const saveActionItems = async (meetingId, items) => {
        const adapter = storageRef.current;
        if (!adapter) throw new Error('Storage not initialized');
        const data = items.map(item => ({
          ...item,
          id: item.id || generateId(),
          meetingId,
          updated: Date.now(),
        }));
        for (const d of data) await adapter.put('actionItems', d);
        return data;
      };

      const getActionItems = async (meetingId) => {
        const adapter = storageRef.current;
        if (!adapter) return [];
        return await adapter.getByIndex('actionItems', 'meetingId', meetingId);
      };

      const uploadAudio = async (meetingId, blob) => {
        const adapter = storageRef.current;
        if (!adapter) throw new Error('Storage not initialized');
        return await adapter.uploadAudio(meetingId, blob);
      };

      const searchMeetings = async (query) => {
        const adapter = storageRef.current;
        if (!adapter) return [];
        const results = await adapter.searchMeetings(query);
        dispatch({ type: 'SET_SEARCH_RESULTS', payload: results });
        return results;
      };

      const value = {
        state,
        dispatch,
        addMeeting,
        updateMeeting,
        deleteMeeting,
        getMeeting,
        generateSummary,
        saveTranscript,
        saveSummary,
        saveActionItems,
        getActionItems,
        uploadAudio,
        searchMeetings,
        initialized,
        authRequired,
        authChecked,
        session,
        authLoading,
        authError,
        signIn,
        signUp,
        signOut,
        updatePassword,
      };

      return React.createElement(AppContext.Provider, { value }, children);
    };

    const useApp = () => useContext(AppContext);

        const total = meetings.length;
        const totalHours = meetings.reduce((acc, m) => acc + (m.duration || 0), 0) / 3600;

    const MeetingDetail = () => {
      const { state, dispatch, getMeeting, getActionItems, deleteMeeting } = useApp();
      const theme = useTheme();
      const [meeting, setMeeting] = useState(null);
      const [loading, setLoading] = useState(true);
      const [actionItems, setActionItems] = useState([]);
      const [activeTab, setActiveTab] = useState(0);
      const [showDeleteDialog, setShowDeleteDialog] = useState(false);

      const meetingId = state.currentMeetingId;

      useEffect(() => {
        if (!meetingId) {
          dispatch({ type: 'SET_VIEW', payload: 'dashboard' });
          return;
        }
        const load = async () => {
          setLoading(true);
          try {
            const m = await getMeeting(meetingId);
            if (m) {
              setMeeting(m);
              const items = await getActionItems(meetingId);
              setActionItems(items.length > 0 ? items : m.actionItems || []);
            } else {
              dispatch({ type: 'SET_VIEW', payload: 'history' });
            }
          } catch (e) {
            console.error('Error loading meeting:', e);
          }
          setLoading(false);
        };
        load();
      }, [meetingId]);

      const handleDelete = async () => {
        if (meetingId) {
          await deleteMeeting(meetingId);
          setShowDeleteDialog(false);
          dispatch({ type: 'SET_VIEW', payload: 'history' });
          dispatch({
            type: 'SET_SNACKBAR',
            payload: { message: 'Meeting deleted successfully.', severity: 'success' }
          });
        }
      };

      const toggleActionItem = async (id) => {
        const updated = actionItems.map(item =>
          item.id === id ? { ...item, completed: !item.completed } : item
        );
        setActionItems(updated);
        if (meeting) {
          const updatedMeeting = { ...meeting, actionItems: updated };

        setLoading(true);

          const res = await searchMeetings(query.trim());
          setResults(res);
          setSearched(true);

          console.error('Search error:', e);

          setLoading(false);

    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error('React Error Boundary caught an error:', error, errorInfo);
        if (window.__markStep) {
          window.__markStep('React render error', false, error && error.message);
        }
        this.setState({ errorInfo });
        if (window.__showDiagnostic) {
          window.__showDiagnostic({
            message: error && error.message,
            filename: 'App component tree',
            lineno: null,
            colno: null,
            stack: (error && error.stack ? error.stack : '') + (errorInfo && errorInfo.componentStack ? '\n\nComponent stack:' + errorInfo.componentStack : ''),
            failedStep: 'React render (Error Boundary)',
          });
        }
      }

      render() {
        if (this.state.hasError) {
          // The diagnostic screen has already been rendered into #root
          // by window.__showDiagnostic in componentDidCatch. Render
          // nothing here to avoid fighting over the DOM.
          return null;
        }
        return this.props.children;
      }
    }

                  'Your data is secure and encrypted.'
                )
              )
            ),

            React.createElement(
              Box, { sx: { textAlign: 'center', mt: 3 } },
              React.createElement(
                Typography, { variant: 'body2', color: 'text.secondary' },
                mode === 'signin' ? "New here? " : 'Already have an account? ',
                React.createElement(
                  'a', {
                    href: '#',
                    onClick: (e) => { e.preventDefault(); switchMode(mode === 'signin' ? 'signup' : 'signin'); },
                    style: { color: COLORS.primary, fontWeight: 600, textDecoration: 'none', cursor: 'pointer' }
                  },
                  mode === 'signin' ? 'Create an account' : 'Sign in'
                )
              )
            )
          )
        )
      );
    };

    // ============================================================
    //  MAIN APP
    // ============================================================
    const App = () => {
      const { state, dispatch, initialized, authRequired, session } = useApp();
      const themeMode = state.darkMode ? 'dark' : 'light';

      const theme = useMemo(() => {
        const base = createTheme({
          palette: {
            mode: themeMode,
            primary: {
              main: '#5B5FEF',
              light: '#8B8FF5',
              dark: '#4338CA',
            },
            secondary: {
              main: '#7C3AED',
              light: '#A78BFA',
              dark: '#5B21B6',
            },
            error: { main: '#EF4444' },
            warning: { main: '#F59E0B' },
            info: { main: '#3B82F6' },
            success: { main: '#22C55E' },
            background: {
              default: themeMode === 'dark' ? '#0f1117' : '#F7F8FC',
              paper: themeMode === 'dark' ? '#1a1d27' : '#ffffff',
            },
            text: {
              primary: themeMode === 'dark' ? '#e8edf2' : '#14142B',
              secondary: themeMode === 'dark' ? '#8b92a5' : '#6B7280',
            },
          },
          typography: {
            fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, sans-serif',
            h3: { fontWeight: 800, letterSpacing: '-0.03em' },
            h4: { fontWeight: 800, letterSpacing: '-0.02em' },
            h5: { fontWeight: 700, letterSpacing: '-0.015em' },
            h6: { fontWeight: 700, letterSpacing: '-0.01em' },
            subtitle1: { fontWeight: 600 },
            subtitle2: { fontWeight: 600 },
            button: { textTransform: 'none', fontWeight: 600 },
          },
          shape: { borderRadius: 18 },
          components: {
            MuiCard: {
              styleOverrides: {
                root: {
                  borderRadius: 20,
                  boxShadow: themeMode === 'dark'
                    ? '0 1px 2px rgba(0,0,0,0.2)'
                    : '0 1px 2px rgba(20,20,43,0.03), 0 8px 24px rgba(20,20,43,0.05)',
                  border: '1px solid',
                  borderColor: themeMode === 'dark' ? 'rgba(255,255,255,0.06)' : 'rgba(20,20,43,0.05)',
                  transition: 'box-shadow 0.25s ease, transform 0.25s ease',
                }
              }
            },
            MuiButton: {
              styleOverrides: {
                root: {
                  borderRadius: 14,
                  fontWeight: 600,
                  textTransform: 'none',
                  transition: 'all 0.2s ease',
                },
                contained: {
                  boxShadow: '0 2px 8px rgba(91,95,239,0.18)',
                  '&:hover': { boxShadow: '0 6px 20px rgba(91,95,239,0.28)', transform: 'translateY(-1px)' },
                }
              }
            },
            MuiAppBar: {
              styleOverrides: {
                root: {
                  backgroundColor: themeMode === 'dark' ? 'rgba(15,17,23,0.85)' : 'rgba(247,248,252,0.85)',
                  backdropFilter: 'blur(20px)',
                  borderBottom: '1px solid',
                  borderColor: themeMode === 'dark' ? 'rgba(255,255,255,0.06)' : 'rgba(20,20,43,0.05)',
                }
              }
            },
            MuiDrawer: {
              styleOverrides: {
                paper: {
                  backgroundColor: themeMode === 'dark' ? '#141720' : '#ffffff',
                  borderRight: '1px solid',
                  borderColor: themeMode === 'dark' ? 'rgba(255,255,255,0.06)' : 'rgba(20,20,43,0.05)',
                }
              }
            },
            MuiChip: {
              styleOverrides: {
                root: {
                  borderRadius: 10,
                  fontWeight: 600,
                }
              }
            },
            MuiListItemButton: {
              styleOverrides: {
                root: {
                  borderRadius: 14,
                  '&.Mui-selected': {
                    backgroundColor: 'rgba(91,95,239,0.10)',
                    '&:hover': { backgroundColor: 'rgba(91,95,239,0.16)' },
                  }
                }
              }
            },
            MuiFab: {
              styleOverrides: {
                root: {
                  boxShadow: '0 10px 30px rgba(91,95,239,0.35)',
                }
              }
            },
            MuiTabs: {
              styleOverrides: {
                indicator: {
                  height: 3,
                  borderRadius: '3px 3px 0 0',
                  backgroundColor: '#5B5FEF',
                }
              }
            },
            MuiTab: {
              styleOverrides: {
                root: {
                  textTransform: 'none',
                  fontWeight: 500,
                  '&.Mui-selected': {
                    fontWeight: 700,
                  }
                }
              }
            }
          }
        });
        return responsiveFontSizes(base);
      }, [themeMode]);

      useEffect(() => {
        if (!initialized) return;
        window.__startup.rendered = true;
        if (window.__markStep) {
          window.__markStep('Routes Loaded', true);
          window.__markStep('<App /> Rendered', true);
        }
      }, [initialized]);

      if (!initialized) {
        return React.createElement(
          Box, { sx: { display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh' } },
          React.createElement(CircularProgress)
        );
      }

      if (authRequired && !session) {
        return React.createElement(
          ThemeProvider, { theme },
          React.createElement(CssBaseline),
          React.createElement(Login)
        );
      }

      const renderView = () => {
        switch (state.view) {
          case 'dashboard':
            return React.createElement(Dashboard);
          case 'new':
            return React.createElement(NewMeeting);
          case 'history':
            return React.createElement(MeetingHistory);
          case 'detail':
            return React.createElement(MeetingDetail);
          case 'search':
            return React.createElement(SearchPage);
          case 'settings':
            return React.createElement(Settings);
          default:
            return React.createElement(Dashboard);
        }
      };

      return React.createElement(
        ThemeProvider, { theme },
        React.createElement(CssBaseline),
        React.createElement(
          Box, {
            className: state.darkMode ? 'dark-mode' : '',
            sx: { minHeight: '100vh', bgcolor: 'background.default' }
          },
          React.createElement(
            Layout, null,
            renderView()
          ),
          React.createElement(
            Snackbar, {
              open: state.snackbar.open,
              autoHideDuration: 4000,
              onClose: () => { dispatch({ type: 'CLOSE_SNACKBAR' }); },
              anchorOrigin: { vertical: 'bottom', horizontal: 'right' },
              sx: { maxWidth: 400 }
            },
            React.createElement(
              Alert, {
                onClose: () => { dispatch({ type: 'CLOSE_SNACKBAR' }); },
                severity: state.snackbar.severity || 'info',
                variant: 'filled',
                sx: { borderRadius: '12px', boxShadow: '0 8px 32px rgba(0,0,0,0.15)' }
              },
              state.snackbar.message
            )
          )
        )
      );
    };

    // ============================================================
    //  BOOTSTRAP - RENDER THE APPLICATION
    // ============================================================
    try {
      if (window.__markStep) window.__markStep('React Loaded', true);
      if (window.__markStep) window.__markStep('ReactDOM Loaded', true);
      if (window.__markStep) window.__markStep('Material UI Loaded', true);

      const root = createRoot(document.getElementById('root'));
      if (window.__markStep) window.__markStep('ReactDOM.createRoot() Executed', true);

      root.render(
        React.createElement(
          React.StrictMode, null,
          React.createElement(
            AppErrorBoundary, null,
            React.createElement(
              AppProvider, null,
              React.createElement(App)
            )
          )
        )
      );
    } catch (bootstrapError) {
      console.error('Fatal bootstrap error:', bootstrapError);
      if (window.__markStep) window.__markStep('ReactDOM.createRoot() Executed', false, bootstrapError.message);
      if (window.__showDiagnostic) {
        window.__showDiagnostic({
          message: bootstrapError.message,
          filename: 'Meeting_summary_app.html (bootstrap)',
          lineno: null,
          colno: null,
          stack: bootstrapError.stack,
          failedStep: 'ReactDOM.createRoot() / render',
        });
      }
    }
  </script>
</body>
</html>
